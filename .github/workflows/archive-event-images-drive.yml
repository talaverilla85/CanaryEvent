name: Archivar imágenes autorizadas en Drive

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Actualizar eventos oficiales"]
    types: [completed]
  schedule:
    - cron: "13 7 * * *"

permissions:
  contents: read

concurrency:
  group: archivo-imagenes-dparranda-drive
  cancel-in-progress: false

jobs:
  archivar:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar catálogo actualizado
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente de Drive y dependencias
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m pip install "google-api-python-client>=2.150,<3" "google-auth>=2.30,<3"
      - name: Probar reglas del archivador
        run: python -m unittest discover -s tests -p "test_drive_image_archive.py" -v
      - name: Archivar con permiso verificado
        env:
          DPARRANDA_GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.DPARRANDA_GOOGLE_DRIVE_OAUTH_JSON }}
        shell: bash
        run: |
          if [[ -z "$DPARRANDA_GOOGLE_DRIVE_OAUTH_JSON" ]]; then
            echo "::notice::Archivo en Drive no activado: falta el secreto de OAuth."
            python scripts/archive_event_images_drive.py --dry-run
          else
            python scripts/archive_event_images_drive.py --max-files 80
          fi
