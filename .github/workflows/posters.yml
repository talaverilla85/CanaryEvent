name: Optimizar carteles oficiales para DParranda
on:
  workflow_dispatch:
  schedule:
    # After the daily official-events scan, in Canary Islands local morning.
    - cron: "22 7 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_poster_thumbnails.py"
      - ".github/workflows/posters.yml"

permissions:
  contents: write

concurrency:
  group: poster-thumbnails-dparranda
  cancel-in-progress: false

jobs:
  webp-posters:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Obtener catálogo y recursos
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de cartelería
        run: python -m pip install "pillow>=10,<13" "requests>=2.31,<3"
      - name: Comprobar rutas y conversiones sin red
        run: python -m unittest -v tests.test_poster_thumbnails
      - name: Generar miniaturas WebP con fuentes oficiales permitidas
        run: python scripts/build_poster_thumbnails.py --max-new 80
      - name: Guardar imágenes estáticas y mapa de URLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/posters/
          if git diff --cached --quiet; then
            echo 'Carteles optimizados al día; no hay nuevos archivos'
            exit 0
          fi
          git commit -m "media: servir carteles WebP optimizados [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Miniaturas publicadas en main (intento $attempt)"
              exit 0
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "Error: main sigue avanzando; no se hizo force-push" >&2
              exit 1
            fi
            echo 'Rebasando únicamente imágenes estáticas sobre main reciente'
            git fetch --no-tags origin main
            git rebase origin/main
          done
