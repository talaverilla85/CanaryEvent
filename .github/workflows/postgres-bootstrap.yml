name: Verificar conexión PostgreSQL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/postgres-bootstrap.yml"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente PostgreSQL
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verificar integridad del origen
        run: python scripts/postgres_migration.py --check
      - name: Importar originales y fichas y comprobar paridad
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DPARRANDA_DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DPARRANDA_DATABASE_URL no está configurado"
            exit 1
          fi
          python scripts/postgres_migration.py --sync
