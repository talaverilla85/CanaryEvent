name: Verificar rendimiento e interfaz DParranda
on:
  pull_request:
    branches: [main]
    paths:
      - "api/catalog.js"
      - "public/**"
      - "tests/**"
      - "scripts/check_frontend_syntax.cjs"
      - "scripts/check_catalog_runtime.cjs"
      - "scripts/check_grid_batches.cjs"
      - "scripts/check_feature_lcp.cjs"
      - "scripts/inspect_shared_pagespeed.py"
      - "scripts/check_poster_runtime.cjs"
      - "scripts/sync_inline_brand_css.cjs"
      - ".github/workflows/frontend-qa.yml"
  push:
    branches: [main]
    paths:
      - "api/catalog.js"
      - "public/index.html"
      - "public/filter_ui.js"
      - "tests/test_frontend_performance_contract.py"
      - "scripts/check_frontend_syntax.cjs"
      - "scripts/check_catalog_runtime.cjs"
      - "scripts/check_grid_batches.cjs"
      - "scripts/check_feature_lcp.cjs"
      - "scripts/inspect_shared_pagespeed.py"
      - "scripts/check_poster_runtime.cjs"
      - "scripts/sync_inline_brand_css.cjs"
      - ".github/workflows/frontend-qa.yml"

permissions:
  contents: read

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r scripts/requirements.txt
      - name: Validar JavaScript del sitio
        run: |
          node --check api/catalog.js
          node scripts/check_frontend_syntax.cjs
          node scripts/check_catalog_runtime.cjs
          node scripts/check_grid_batches.cjs
          node scripts/check_feature_lcp.cjs
          node scripts/check_poster_runtime.cjs
          node scripts/sync_inline_brand_css.cjs --check
      - name: Diagnosticar enlaces PageSpeed compartidos (temporal)
        run: python scripts/inspect_shared_pagespeed.py
      - name: Pruebas de la interfaz y compatibilidad
        run: python -m unittest discover -s tests -q
