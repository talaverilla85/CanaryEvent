name: Verificar rendimiento e interfaz DParranda
on:
  pull_request:
    branches: [main]
    paths:
      - "api/catalog.js"
      - "public/**"
      - "tests/**"
      - "scripts/check_frontend_syntax.cjs"
      - "scripts/check_catalog_runtime.cjs"
      - "scripts/check_grid_batches.cjs"
      - "scripts/check_feature_lcp.cjs"
      - "scripts/check_poster_runtime.cjs"
      - "scripts/sync_inline_brand_css.cjs"
      - ".github/workflows/frontend-qa.yml"
  push:
    branches: [main]
    paths:
      - "api/catalog.js"
      - "api/advertise-interest.js"
      - "api/admin.js"
      - "api/stripe-webhook.js"
      - "lib/facturadirecta-*.js"
      - "lib/advertising-invoice-*.js"
      - "tests/**"
      - "tests/test_fiscal_issuance.mjs"
      - "tests/test_invoice_adjustments.mjs"
      - "tests/test_facturadirecta_sandbox.mjs"
      - "tests/test_invoice_resend.mjs"
      - "public/index.html"
      - "public/admin/**"
      - "public/filter_ui.js"
      - "tests/test_frontend_performance_contract.py"
      - "scripts/check_frontend_syntax.cjs"
      - "scripts/check_catalog_runtime.cjs"
      - "scripts/check_grid_batches.cjs"
      - "scripts/check_feature_lcp.cjs"
      - "scripts/check_poster_runtime.cjs"
      - "scripts/sync_inline_brand_css.cjs"
      - ".github/workflows/frontend-qa.yml"

permissions:
  contents: read

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r scripts/requirements.txt
      - name: Validar JavaScript del sitio
        run: |
          node --check api/catalog.js
          node --check public/admin/install.js
          node --check public/install_prompt.js
          node tests/test_install_prompt.js
          node tests/test_admin_install.js
          node scripts/check_frontend_syntax.cjs
          node scripts/check_catalog_runtime.cjs
          node scripts/check_grid_batches.cjs
          node scripts/check_feature_lcp.cjs
          node scripts/check_poster_runtime.cjs
          node scripts/sync_inline_brand_css.cjs --check
      - name: Instalar dependencias Node para comprobar transacciones simuladas
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Auditar el circuito comercial sin envíos ni cobros reales
        run: |
          node --check api/advertise-interest.js
          node --check api/advertiser.js
          node --check api/stripe-webhook.js
          node --check lib/advertiser-mail.js
          node --check lib/stripe-advertising.js
          node --check lib/advertiser-publication.js
          node --check lib/advertising-archive.js
          node --check lib/facturadirecta-invoices.js
          node --check lib/facturadirecta-sandbox.js
          node --check lib/advertising-invoice-issuance.js
          node --check lib/advertising-invoice-resend.js
          node --check lib/advertising-invoice-adjustments.js
          node --check lib/advertising-invoice-simulator.js
          node --test tests/test_commercial_workflow.mjs tests/test_fiscal_issuance.mjs tests/test_invoice_adjustments.mjs tests/test_invoice_sandbox_demo.mjs tests/test_facturadirecta_sandbox.mjs tests/test_invoice_resend.mjs tests/test_advertise_interest_validation.mjs
      - name: Verificar imágenes oficiales de Mesa y López y protección del relé
        run: node --test tests/official-poster.test.mjs
      - name: Verificar imágenes, SEO y fichas de Mogán Mall
        run: node --test tests/mogan-mall-seo.test.mjs
      - name: Pruebas de la interfaz y compatibilidad
        run: python -m unittest discover -s tests -q
