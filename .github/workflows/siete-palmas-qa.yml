name: Verificar extractor Siete Palmas
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/shopping_centres_gc.py"
      - "scripts/sync_events.py"
      - "tests/test_siete_palmas_gc.py"
      - "tests/test_shopping_centres_gc.py"
      - ".github/workflows/siete-palmas-qa.yml"
permissions:
  contents: read
jobs:
  verify-shopping-centres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Check parser syntax
        run: python -m py_compile scripts/shopping_centres_gc.py scripts/sync_events.py
      - name: Test shopping-centre readers, dates and image URLs
        run: python -m unittest discover -s tests -p 'test_*shopping_centres_gc.py' -v && python -m unittest discover -s tests -p 'test_siete_palmas_gc.py' -v
