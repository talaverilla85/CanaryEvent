name: Actualizar eventos oficiales
on:
  workflow_dispatch:
  schedule:
    # Una pasada diaria a las 05:37 UTC (05:37 invierno / 06:37 verano Canarias).
    - cron: "37 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_events.py"
      - "scripts/cabildo_public.py"
      - "scripts/ulpgc_venue_facts.py"
      - "scripts/source_facts.py"
      - "scripts/official_address_locations.py"
      - "scripts/venue_facts.py"
      - "scripts/audit_source_health_gc.py"
      - "scripts/venue_quality.py"
      - "scripts/verified_venue_coordinates.py"
      - "scripts/cross_source_venue_facts.py"
      - "scripts/organizer_venues.py"
      - "scripts/structured_organizer_venues.py"
      - "scripts/structured_organizer_venues.py"
      - "scripts/ticket_reserva.py"
      - "scripts/audit_price_provenance.py"
      - "scripts/santalucia_festivals.py"
      - "scripts/arucas_agenda.py"
      - "scripts/galdar_agenda.py"
      - "scripts/santabrigida_agenda.py"
      - "scripts/teror_auditorio.py"
      - "scripts/telde_fiestas.py"
      - "scripts/municipal_listing_dedup.py"
      - "scripts/cinema_policy.py"
      - "scripts/event_occurrences.py"
      - "scripts/program_quality.py"
      - "scripts/ingenio_juvenil_program.py"
      - "scripts/artenara_ferias.py"
      - "scripts/valsequillo_medianias.py"
      - "scripts/tejeda_agenda.py"
      - "scripts/telde_barrio_programs.py"
      - "scripts/telde_pdf_vision.py"
      - "scripts/telde_pdf_auto.py"
      - "scripts/telde_pdf_verified.py"
      - "scripts/telde_pdf_integrity.py"
      - "scripts/refresh_telde_pdf_index.py"
      - "scripts/municipal_pdf_sources.py"
      - "scripts/refresh_municipal_pdf_index.py"
      - "scripts/municipal_pdf_auto.py"
      - "scripts/gc_documented_events.py"
      - "scripts/aldea_ecoentradas.py"
      - "scripts/official_culture_calendars.py"
      - "scripts/coverage_gc.py"
      - "scripts/gc_source_radar.py"
      - "scripts/official_venue_confirmations.py"
      - "scripts/ulpgc_cinema_venues.py"
      - "scripts/official_stage_agendas.py"
      - "scripts/fimc_island_agenda.py"
      - "scripts/island_eventon_agendas.py"
      - "scripts/island_source_intelligence.py"
      - "scripts/poster_venues.py"
      - "scripts/telde_hall_venues.py"
      - "scripts/cuyas_corroboration.py"
      - "scripts/venue_title_variants.py"
      - "scripts/ticket_recent.py"
      - "scripts/publish_synced_data.sh"
      - "scripts/artes_details.py"
      - "scripts/requirements.txt"
      - "tests/**"
      - ".github/workflows/sync-events.yml"
permissions:
  contents: write
concurrency:
  group: sync-canaryevent
  cancel-in-progress: false
jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r scripts/requirements.txt
      - name: Comprobar parser y deduplicación
        run: python -m unittest discover -s tests -v
      - name: Detectar nuevos PDF oficiales de Telde
        continue-on-error: true
        run: python scripts/refresh_telde_pdf_index.py
      - name: Extraer actividades de PDF con IA cuando hay clave configurada
        continue-on-error: true
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            python scripts/telde_pdf_auto.py --api --max-docs 2 --max-pages 3 --max-api-calls 4 --max-cost-usd 0.05
          else
            python scripts/telde_pdf_auto.py --archive-only
            echo "Sin clave IA configurada: se archivan caducados sin llamadas de pago."
          fi
      - name: Descubrir programas PDF de otros ayuntamientos
        continue-on-error: true
        run: python scripts/refresh_municipal_pdf_index.py
      - name: Leer con IA programas PDF futuros de Santa Lucía, Agüimes y Gáldar
        continue-on-error: true
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            python scripts/municipal_pdf_auto.py --api --max-docs 1 --max-pages 3 --max-api-calls 4 --max-cost-usd 0.05
          else
            python scripts/municipal_pdf_auto.py --archive-only
          fi
      - name: Localizar fuentes y titulares nuevos de los municipios incompletos
        continue-on-error: true
        run: python scripts/gc_source_radar.py --max-sites 8
      - name: Obtener y verificar eventos oficiales y carteles
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        run: python scripts/sync_events.py
      - name: Auditar calidad de fichas y conectores
        run: python scripts/audit_source_health_gc.py
      - name: Actualizar matriz de cobertura de los 21 municipios
        run: python scripts/coverage_gc.py
      - name: Auditar precios y gratuidad de fuentes oficiales
        run: python scripts/audit_price_provenance.py --output data/price_provenance_audit.json
      - name: Comprobar cobertura cultural y productoras de las ocho islas
        run: python scripts/island_source_intelligence.py
      - name: Guardar base de datos y exportación
        shell: bash
        run: bash scripts/publish_synced_data.sh

