name: Actualizar eventos oficiales
on:
  workflow_dispatch:
  schedule:
    # Una pasada diaria a las 05:37 UTC (05:37 invierno / 06:37 verano Canarias).
    - cron: "37 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_events.py"
      - "scripts/cabildo_public.py"
      - "scripts/source_facts.py"
      - "scripts/ticket_reserva.py"
      - "scripts/santalucia_festivals.py"
      - "scripts/ticket_recent.py"
      - "scripts/publish_synced_data.sh"
      - "scripts/artes_details.py"
      - "scripts/requirements.txt"
      - "tests/**"
      - ".github/workflows/sync-events.yml"
permissions:
  contents: write
concurrency:
  group: sync-canaryevent
  cancel-in-progress: false
jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r scripts/requirements.txt
      - name: Comprobar parser y deduplicación
        run: python -m unittest discover -s tests -v
      - name: Obtener y verificar eventos oficiales
        run: python scripts/sync_events.py
      - name: Guardar base de datos y exportación
        shell: bash
        run: bash scripts/publish_synced_data.sh
