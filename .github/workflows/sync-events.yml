name: Actualizar eventos oficiales
on:
  workflow_dispatch:
  schedule:
    # 03:37, 09:37, 15:37 y 21:37 UTC; ejecución aproximada
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync_events.py"
      - "scripts/requirements.txt"
      - "tests/**"
      - ".github/workflows/sync-events.yml"
permissions:
  contents: write
concurrency:
  group: sync-canaryevent
  cancel-in-progress: false
jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r scripts/requirements.txt
      - name: Comprobar parser y deduplicación
        run: python -m unittest discover -s tests -v
      - name: Obtener y verificar eventos oficiales
        run: python scripts/sync_events.py
      - name: Guardar base de datos y exportación
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.sqlite public/events.json public/meta.json
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar"
            exit 0
          fi
          git commit -m "data: actualizar eventos y estado de fuentes [skip ci]"
          git push origin HEAD:main
