name: Solicitudes y pagos publicitarios DParranda por Telegram

on:
  # Pausado durante el lanzamiento orgánico; conservar para reactivación futura.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/telegram_advertising_leads.py"
      - ".github/workflows/telegram-advertising-leads.yml"

permissions:
  contents: read

concurrency:
  group: dparranda-advertising-interest-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Leer monitor desde GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar acceso seguro a PostgreSQL y Telegram
        run: python -m pip install "psycopg[binary]>=3.2,<4" "requests>=2.32,<3"
      - name: Validar alertas de solicitudes y pagos
        run: python -m unittest discover -s tests -p "test_advertising_interest_bot.py"
      - name: Avisar de solicitudes y pagos confirmados sin datos personales
        if: github.event_name != 'push'
        env:
          DATABASE_URL: ${{ secrets.DPARRANDA_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/telegram_advertising_leads.py
