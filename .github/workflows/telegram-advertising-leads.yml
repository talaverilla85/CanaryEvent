name: Nuevos anunciantes DParranda por Telegram

on:
  schedule:
    # GitHub Actions scheduled checks are best-effort, not exact real-time.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/telegram_advertising_leads.py"
      - ".github/workflows/telegram-advertising-leads.yml"

permissions:
  contents: read

concurrency:
  group: dparranda-advertising-interest-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Leer monitor desde GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar acceso seguro a PostgreSQL y Telegram
        run: python -m pip install "psycopg[binary]>=3.2,<4" "requests>=2.32,<3"
      - name: Avisar de nueva solicitud, sin enviar datos personales
        env:
          DATABASE_URL: ${{ secrets.DPARRANDA_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/telegram_advertising_leads.py --test
          fi
          python scripts/telegram_advertising_leads.py
