name: Validar archivador multimedia Drive
on:
  pull_request:
    paths:
      - 'scripts/archive_event_images_drive.py'
      - 'scripts/drive_oauth_setup.py'
      - 'tests/test_drive_image_archive.py'
      - '.github/workflows/archive-event-images-drive.yml'
      - '.github/workflows/test-drive-image-archive.yml'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de imágenes
        run: python -m pip install -r scripts/requirements.txt
      - name: Comprobar sintaxis
        run: python -m py_compile scripts/archive_event_images_drive.py scripts/drive_oauth_setup.py
      - name: Probar reglas
        run: python -m unittest discover -s tests -p 'test_drive_image_archive.py' -v
      - name: Diagnóstico sin conexiones ni credenciales
        run: python scripts/archive_event_images_drive.py --dry-run
