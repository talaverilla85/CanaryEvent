name: Avisos de DParranda por Telegram

on:
  # Independent of the source workflow: alerts still fire on failed/timeout runs.
  workflow_run:
    workflows: ["Actualizar eventos oficiales"]
    types: [completed]
    branches: [main]
  # Update Telegram's visible bot name as soon as branding changes land on main.
  push:
    branches: [main]
    paths:
      - "scripts/telegram_health_alert.py"
      - ".github/workflows/telegram-sync-alerts.yml"
  # Manual test, including bot display-name refresh.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-health-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Leer reglas de notificación desde main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar dependencia Telegram
        run: python -m pip install 'requests>=2.32,<3'
      - name: Actualizar nombre visible del bot a DParranda
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_health_alert.py --configure-profile
      - name: Notificar errores o enviar prueba
        if: ${{ github.event_name != 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          SOURCE_RUN_FINISHED_AT: ${{ github.event.workflow_run.updated_at }}
          IS_MANUAL_TEST: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ "$IS_MANUAL_TEST" == "true" ]]; then
            python scripts/telegram_health_alert.py --test
          else
            python scripts/telegram_health_alert.py
          fi
